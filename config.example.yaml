bind_host: "0.0.0.0"
bind_port: 65287
data_dir: "./data/objects"
public_base_url: "https://storage-deepspace.papegames.com"

# Pape-SDK 调用管理端签发接口时使用，仅在服务间传递。
admin_token: "replace-with-a-long-random-admin-token"
# 用于签名短期上传令牌，至少 32 个字符，不能与 admin_token 相同。
signing_key: "replace-with-an-independent-32-byte-signing-key"

token_ttl_seconds: 1200
max_upload_bytes: 268435456
